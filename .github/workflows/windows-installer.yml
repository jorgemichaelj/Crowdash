name: Windows — instalador de teste

on:
  workflow_dispatch:
  push:
    branches: [release/windows-v0.1.0]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar Rust estável
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Verificar TypeScript
        run: pnpm lint
      - name: Testar interface, extensão e inicialização
        run: pnpm test
      - name: Testar preparação do pacote
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Testar downloads
        run: cargo test --manifest-path crates/download-core/Cargo.toml --locked
      - name: Testar conexão nativa
        run: cargo test --manifest-path crates/extension-bridge/Cargo.toml --locked
      - name: Preparar ferramentas incluídas no instalador
        run: python scripts/prepare_windows_runtime.py
      - name: Compilar instalador Windows e incluir a extensão
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          pnpm --filter @crowdash/desktop build:native --config src-tauri/tauri.windows-release.conf.json --bundles nsis *>&1 | Tee-Object artifacts/windows/build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $detail = (Get-Content artifacts/windows/build.log -Tail 35) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Erro ao compilar o instalador::$detail"
          }
          exit $buildExit
      - name: Testar resolução das ferramentas do aplicativo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PATH = "$pwd/apps/desktop/src-tauri/runtime/windows-x64;$env:PATH"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked *>&1 | Tee-Object artifacts/windows/native-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $detail = ((Get-Content artifacts/windows/native-tests.log -Tail 35) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Erro nos testes nativos::$detail"
          }
          exit $testExit
      - name: Preparar arquivos para teste
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows/extension | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe artifacts/windows/
          Copy-Item apps/extension/dist/* artifacts/windows/extension/ -Recurse
          Copy-Item docs/WINDOWS.md artifacts/windows/LEIA-ME.md
          Copy-Item apps/desktop/src-tauri/runtime/windows-x64/manifest.json artifacts/windows/runtime-manifest.json
      - name: Instalar, testar downloads reais locais e desinstalar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $installer = Get-ChildItem artifacts/windows/*.exe | Select-Object -First 1
          python scripts/smoke_windows_install.py $installer.FullName *>&1 | Tee-Object artifacts/windows/install-test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $detail = ((Get-Content artifacts/windows/install-test.log -Tail 35) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Erro ao testar o app instalado::$detail"
          }
          exit $testExit
      - name: Calcular checksum do instalador
        shell: pwsh
        run: |
          Get-ChildItem artifacts/windows/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content artifacts/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crowdash-windows-test
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
